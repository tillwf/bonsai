<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonsai Image</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-muted: #888;
      --accent: #7eb87e;
      --accent-dim: #4a7a4a;
      --danger: #c0392b;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: auto 1fr;
    }

    header {
      grid-column: 1 / -1;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header .badge {
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .mode-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      margin-left: auto;
    }
    .mode-badge.loading { background: #2a2a00; color: #aaa; }
    .mode-badge.gpu     { background: #002a2a; color: #4ecdc4; }
    .mode-badge.cpu     { background: #2a1a00; color: #e0aa44; }
    .mode-badge.error   { background: #2a0000; color: #e04444; }

    .cpu-warning {
      background: #1e1500;
      border: 1px solid #3a2a00;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12px;
      color: #c09030;
      line-height: 1.5;
      display: none;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent-dim);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .size-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .size-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      padding: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: all 0.15s;
    }

    .size-btn:hover { border-color: var(--accent-dim); color: var(--text); }
    .size-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(126,184,126,0.08); }

    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > * { flex: 1; }

    .seed-row { display: flex; gap: 6px; }
    .seed-row input { flex: 1; }
    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--accent-dim); color: var(--text); }

    .generate-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0e1a0e;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .generate-btn:hover { background: #8fca8f; }
    .generate-btn:disabled { background: var(--accent-dim); color: #2a4a2a; cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .generating .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .steps-row { display: flex; align-items: center; gap: 10px; }
    .steps-row input[type="range"] {
      flex: 1; accent-color: var(--accent);
      background: none; border: none; padding: 0;
    }
    .steps-val {
      min-width: 24px; text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    /* Canvas / result area */
    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .placeholder {
      text-align: center;
      color: var(--text-muted);
    }

    .placeholder svg { opacity: 0.2; margin-bottom: 12px; }
    .placeholder p { font-size: 13px; }

    .result-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      display: none;
    }

    .img-actions {
      position: absolute;
      bottom: 40px;
      right: 40px;
      display: none;
      gap: 8px;
    }

    .img-action-btn {
      background: rgba(22,22,22,0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
    }

    .img-action-btn:hover { border-color: var(--accent-dim); }

    .progress-bar {
      height: 2px;
      background: var(--border);
      position: relative;
      overflow: hidden;
      display: none;
    }

    .progress-bar.visible { display: block; }

    .progress-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-100%);
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Gallery */
    .gallery-section {
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .gallery-header {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .gallery-header h2 { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .gallery-toggle { color: var(--text-muted); font-size: 10px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
      padding: 0 16px 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .gallery-grid.hidden { display: none; }

    .gallery-item {
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
      position: relative;
    }

    .gallery-item:hover { border-color: var(--accent-dim); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .error-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2a0e0e;
      border: 1px solid var(--danger);
      color: #e88;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      transition: transform 0.3s;
      z-index: 100;
    }

    .error-toast.show { transform: translateX(-50%) translateY(0); }

    select option { background: var(--surface2); }

    .field { display: flex; flex-direction: column; }
  </style>
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M10 2C10 2 6 5 6 9c0 1.5.5 2.8 1.3 3.8L10 18l2.7-5.2C13.5 11.8 14 10.5 14 9c0-4-4-7-4-7z" fill="#7eb87e"/>
    <line x1="10" y1="12" x2="10" y2="18" stroke="#7eb87e" stroke-width="1.5"/>
  </svg>
  <h1>Bonsai Image</h1>
  <span class="badge">4B</span>
  <span class="mode-badge loading" id="mode-badge">loading…</span>
</header>

<aside class="sidebar">
  <div class="field">
    <label>Prompt</label>
    <textarea id="prompt" placeholder="a tiny bonsai tree on a wooden desk, soft morning light, bokeh background, photorealistic" rows="5"></textarea>
  </div>

  <div class="field">
    <label>Size</label>
    <div class="size-grid">
      <button class="size-btn active" data-w="1024" data-h="1024">1024 × 1024<br><small>Square</small></button>
      <button class="size-btn" data-w="1248" data-h="832">1248 × 832<br><small>Landscape</small></button>
      <button class="size-btn" data-w="832" data-h="1248">832 × 1248<br><small>Portrait</small></button>
      <button class="size-btn" data-w="1536" data-h="640">1536 × 640<br><small>Wide</small></button>
    </div>
  </div>

  <div class="field">
    <label>Steps</label>
    <div class="steps-row">
      <input type="range" id="steps" min="1" max="20" value="4">
      <span class="steps-val" id="steps-val">4</span>
    </div>
  </div>

  <div class="field">
    <label>Backend</label>
    <select id="backend">
      <option value="">Server default</option>
      <option value="bonsai-ternary-gemlite">Ternary (gemlite)</option>
      <option value="bonsai-ternary-mlx">Ternary (MLX)</option>
      <option value="bonsai-binary-gemlite">Binary (gemlite)</option>
      <option value="bonsai-binary-mlx">Binary (MLX)</option>
    </select>
  </div>

  <div class="field">
    <label>Seed</label>
    <div class="seed-row">
      <input type="number" id="seed" placeholder="Random" min="0" max="2147483647">
      <button class="icon-btn" id="rand-seed" title="Randomize">⚄</button>
    </div>
  </div>

  <div class="cpu-warning" id="cpu-warning">
    ⚠ CPU mode — no GPU detected. Generation takes ~30–90 min per image.
    Model download (~10 GB) happens on first run.
  </div>

  <button class="generate-btn" id="gen-btn">
    <div class="spinner"></div>
    <span id="gen-label">Generate</span>
  </button>
</aside>

<main class="main">
  <div class="progress-bar" id="progress-bar"></div>

  <div class="canvas-area" id="canvas-area">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="8" width="48" height="48" rx="8" stroke="#7eb87e" stroke-width="2"/>
        <path d="M32 16C32 16 24 22 24 30c0 3 1 5.5 2.6 7.5L32 52l5.4-10.5C39 39.5 40 37 40 30c0-8-8-14-8-14z" fill="#7eb87e" opacity="0.6"/>
      </svg>
      <p>Enter a prompt and click Generate</p>
    </div>
    <img class="result-img" id="result-img" alt="Generated image">
    <div class="img-actions" id="img-actions">
      <button class="img-action-btn" id="download-btn">↓ Save</button>
      <button class="img-action-btn" id="copy-seed-btn">⚄ Copy seed</button>
    </div>
  </div>

  <div class="gallery-section" id="gallery-section" style="display:none">
    <div class="gallery-header" id="gallery-header">
      <h2>Generated (<span id="gallery-count">0</span>)</h2>
      <span class="gallery-toggle" id="gallery-toggle">▲</span>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>
</main>

<div class="error-toast" id="error-toast"></div>

<script>
  const $ = id => document.getElementById(id);
  let currentSeed = null;
  let currentFilename = null;
  let galleryOpen = true;

  // Steps slider
  $('steps').addEventListener('input', () => {
    $('steps-val').textContent = $('steps').value;
  });

  // Size buttons
  let selectedSize = { w: 1024, h: 1024 };
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSize = { w: +btn.dataset.w, h: +btn.dataset.h };
    });
  });

  // Randomize seed
  $('rand-seed').addEventListener('click', () => {
    $('seed').value = Math.floor(Math.random() * 2147483647);
  });

  // Start disabled until status confirms model is ready
  $('gen-btn').disabled = true;

  // Generate
  $('gen-btn').addEventListener('click', generate);
  $('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate();
  });

  async function generate() {
    const prompt = $('prompt').value.trim();
    if (!prompt) { showError('Enter a prompt'); return; }

    const btn = $('gen-btn');
    btn.disabled = true;
    btn.classList.add('generating');
    $('gen-label').textContent = 'Generating…';
    $('progress-bar').classList.add('visible');
    $('img-actions').style.display = 'none';

    const seedVal = $('seed').value;
    const backend = $('backend').value;

    const body = {
      prompt,
      steps: +$('steps').value,
      width: selectedSize.w,
      height: selectedSize.h,
    };
    if (seedVal) body.seed = +seedVal;
    if (backend) body.backend = backend;

    try {
      const res = await fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `HTTP ${res.status}`);
      }

      const { filename, seed } = await res.json();
      currentFilename = filename;
      currentSeed = seed;

      $('placeholder').style.display = 'none';
      const img = $('result-img');
      img.src = `/images/${filename}?t=${Date.now()}`;
      img.style.display = 'block';
      img.onload = () => {
        $('img-actions').style.display = 'flex';
      };

      $('seed').value = seed;
      await loadGallery();

    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.classList.remove('generating');
      $('gen-label').textContent = 'Generate';
      $('progress-bar').classList.remove('visible');
    }
  }

  // Download
  $('download-btn').addEventListener('click', () => {
    if (!currentFilename) return;
    const a = document.createElement('a');
    a.href = `/images/${currentFilename}`;
    a.download = currentFilename;
    a.click();
  });

  // Copy seed
  $('copy-seed-btn').addEventListener('click', () => {
    if (currentSeed === null) return;
    navigator.clipboard.writeText(String(currentSeed));
    $('copy-seed-btn').textContent = '✓ Copied';
    setTimeout(() => { $('copy-seed-btn').textContent = '⚄ Copy seed'; }, 1500);
  });

  // Gallery
  async function loadGallery() {
    const res = await fetch('/images');
    const images = await res.json();
    $('gallery-count').textContent = images.length;

    if (images.length === 0) {
      $('gallery-section').style.display = 'none';
      return;
    }

    $('gallery-section').style.display = 'block';
    const grid = $('gallery-grid');
    grid.innerHTML = '';
    images.forEach(({ filename }) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = `/images/${filename}`;
      img.loading = 'lazy';
      div.appendChild(img);
      div.addEventListener('click', () => {
        currentFilename = filename;
        $('result-img').src = `/images/${filename}?t=${Date.now()}`;
        $('result-img').style.display = 'block';
        $('placeholder').style.display = 'none';
        $('img-actions').style.display = 'flex';
      });
      grid.appendChild(div);
    });
  }

  $('gallery-header').addEventListener('click', () => {
    galleryOpen = !galleryOpen;
    $('gallery-grid').classList.toggle('hidden', !galleryOpen);
    $('gallery-toggle').textContent = galleryOpen ? '▲' : '▼';
  });

  let _statusMode = 'loading';

  async function pollStatus() {
    try {
      const res = await fetch('/status');
      const { mode, error } = await res.json();
      const badge = $('mode-badge');
      badge.className = `mode-badge ${mode}`;
      if (mode === 'loading') {
        badge.textContent = 'loading model…';
        setTimeout(pollStatus, 2000);
      } else if (mode === 'gpu') {
        badge.textContent = 'GPU';
        $('gen-btn').disabled = false;
      } else if (mode === 'cpu') {
        badge.textContent = 'CPU (slow)';
        $('cpu-warning').style.display = 'block';
        $('gen-btn').disabled = false;
        // CPU download may still be happening — keep showing progress via generate errors
      } else if (mode === 'error') {
        badge.textContent = 'error';
        showError('Pipeline error: ' + (error || 'unknown'));
      }
      _statusMode = mode;
    } catch {
      setTimeout(pollStatus, 3000);
    }
  }

  function showError(msg) {
    const t = $('error-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  loadGallery();
  pollStatus();
</script>
</body>
</html>
